<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facilities</title>
  <link rel="stylesheet" href="/src/facilities/facilities.css" />
</head>
<body>
  <header class="facilities-header">
  <div class="search-row">
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search facilities..."
        aria-label="Search facilities"
      />
    </div>
  </div>

  <div class="actions-row">
    <a href="/facilities.html" class="nav-action active" aria-current="page">
      Facilities
    </a>

    <a href="/myReservations.html" class="nav-action">
      My Reservations
    </a>

    <a href="#" id="logoutLink" class="nav-action">
      Logout
    </a>
  </div>
</header>
  <main class="facilities-page">
    <section class="page-intro">
      <h1>Available Facilities</h1>
      <p>Choose a facility to view more details.</p>
    </section>

    <section id="loadingState" class="state-message">
      <p>Loading facilities...</p>
    </section>

    <section id="errorState" class="state-message hidden">
      <p>Could not load facilities. Please try again.</p>
      <button id="retryButton" type="button" class="retry-button">Retry</button>
    </section>

    <section id="emptyState" class="state-message hidden">
      <p>No facilities available at the moment.</p>
    </section>

    <section
      id="facilitiesGrid"
      class="facilities-grid hidden"
      aria-live="polite"
    ></section>
  </main>
  <section id="reservationModal" class="modal hidden" aria-hidden="true">
  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="reservationModalTitle">
    <div class="modal-header">
      <h2 id="reservationModalTitle">Create Reservation</h2>
      <button type="button" id="closeModalButton" class="modal-close-button">×</button>
    </div>

    <form id="reservationForm" class="reservation-form">
      <div class="form-group">
        <label for="facilityNameInput">Facility</label>
        <input id="facilityNameInput" type="text" readonly />
        <input id="facilityIdInput" name="facility_id" type="hidden" />
      </div>

      <div class="form-group">
  <label for="reservationDateInput">Date</label>
  <input id="reservationDateInput" name="reservation_date" type="date" required />
</div>

<div class="form-group">
  <label for="startSlotSelect">Start time</label>
  <select id="startSlotSelect" name="start_slot" required></select>
</div>

<div class="form-group">
  <label for="durationSelect">Duration</label>
  <select id="durationSelect" name="duration" required></select>
</div>

<div class="form-group">
  <label for="calculatedEndTime">End time</label>
  <input id="calculatedEndTime" type="text" readonly />
</div>

<div class="form-group">
  <label for="calculatedPrice">Price</label>
  <input id="calculatedPrice" type="text" readonly />
</div>

      <div id="reservationFormMessage" class="form-message hidden"></div>

      <div class="modal-actions">
        <button type="submit" class="book-button">Confirm reservation</button>
        <button type="button" id="cancelModalButton" class="back-button">Cancel</button>
      </div>
    </form>
  </div>
</section>
  <script type="module" src="/src/facilities/facilities.js"></script>
</body>
</html>
