<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="/src/register/register.css" />
</head>
<body>
  <main class="register-page">
    <section class="register-card">
      <h1>Create account</h1>
      <p class="subtitle">Register to continue.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
          <p class="error-message" id="emailError"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="new-password"
          />
          <p class="error-message" id="passwordError"></p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
          />
          <p class="error-message" id="confirmPasswordError"></p>
        </div>

        <p class="server-message" id="serverMessage"></p>

        <button type="submit" id="registerButton">Create account</button>
      </form>

      <p class="footer-text">
        Already have an account?
        <a href="/login.html">Login</a>
      </p>
    </section>
  </main>

  <script type="module" src="/src/register/register.js"></script>
</body>
</html>
